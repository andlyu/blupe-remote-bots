name: Shared runner
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - run: python -m pip install -r codex-runner/requirements.txt pytest
      - run: PYTHONPATH=codex-runner/src:codex-runner python -m pytest codex-runner/tests -q
      - run: node --test codex-runner/tests/*.cjs
      - run: python -m unittest discover -s codex-runner/integrations/roboskills/site/worker-agent -p 'test_*.py' -v

  website:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-runner/integrations/roboskills/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/physical-route.test.cjs
      - run: npx tsc --noEmit
